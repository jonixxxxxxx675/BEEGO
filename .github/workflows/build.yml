name: BEEGO Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Unpack BEEGO project
        run: unzip -o BEEGO_V2_TEMPLATE_ANDROID.zip

      - name: Create startup test
        working-directory: BEEGOPlay
        run: |
          cat > app/src/main/java/com/beego/app/MainActivity.kt <<'EOF'
          package com.beego.app

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val screen = TextView(this)
                  screen.text = "BEEGO\n\nAndroid startup OK"
                  screen.textSize = 28f
                  screen.setTextColor(Color.WHITE)
                  screen.setBackgroundColor(Color.rgb(7, 9, 9))
                  screen.gravity = Gravity.CENTER

                  setContentView(screen)
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: BEEGOPlay
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BEEGO-APK-TEST
          path: BEEGOPlay/app/build/outputs/apk/debug/*.apk
